version: "2"
type: frontend
tech_stack:
  - React (Next.js 15)
  - TypeScript
  - Tailwind CSS
  - Lucide React
routes:
  - path: /audit
    file: src/components/audit/B2BAuditPage.tsx
    auth_required: false
    description: B2B Audit Landing and Auth Page
features:
  - name: Member Login
    description: Login functionality for B2B members with ID and Password
    files:
      - src/components/audit/B2BAuditPage.tsx
    entry_route: /audit
    user_interactions:
      - Fill ID field
      - Fill Password field
      - Click Login button
    api_calls: []
    auth_required: false
  - name: 3-Step Member Signup
    description: Secure signup process with Terms Agreement (Step 1), Info Entry (Step 2), and Completion (Step 3)
    files:
      - src/components/audit/B2BAuditPage.tsx
    entry_route: /audit
    user_interactions:
      - Click Signup link
      - Toggle All-Agree checkbox (syncs individual terms)
      - Select Member Type (Personal/Business)
      - Click Next step button (active only when conditions met)
      - Fill member info
      - Submit signup
    api_calls: []
    auth_required: false
  - name: Identity Verification Simulation
    description: Simulation of mobile phone identity verification for audits
    files:
      - src/components/audit/B2BAuditPage.tsx
    entry_route: /audit
    user_interactions:
      - Click Identity Auth button
      - See "Service Maintenance" alert
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Backend APIs are mocked for the audit simulation
    location: src/components/audit/B2BAuditPage.tsx
    impact: Data is not persisted to a real database
