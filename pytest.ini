[pytest]
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 기본 옵션
addopts =
    --tb=short
    --strict-markers
    -v

# 마커 정의
markers =
    smoke: 기본 동작 확인 (빠른 스모크 테스트)
    auth: 로그인/인증 필요
    destructive: 실제 데이터 생성 (프로덕션 실행 주의)
    slow: 30초 이상 소요

# Playwright 설정
# PLAYWRIGHT_BASE_URL 환경변수로 대상 URL 설정 (기본: https://www.cocoalba.kr)
# 브라우저: Chromium (기본)
