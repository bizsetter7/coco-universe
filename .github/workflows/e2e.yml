name: E2E Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: '테스트 대상 URL (기본: https://www.cocoalba.kr)'
        required: false
        default: 'https://www.cocoalba.kr'
      test_filter:
        description: 'pytest -k 필터 (예: smoke, auth, 빈칸=전체)'
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.cocoalba.kr' }}
      TEST_USER_ID:   ${{ secrets.TEST_USER_ID }}
      TEST_USER_PW:   ${{ secrets.TEST_USER_PW }}
      TEST_SHOP_ID:   ${{ secrets.TEST_SHOP_ID }}
      TEST_SHOP_PW:   ${{ secrets.TEST_SHOP_PW }}

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python 설치 ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      # ── 3. Python 패키지 설치 ─────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements-test.txt

      # ── 4. Playwright 브라우저 설치 ───────────────────────────────
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── 5. 리포트 디렉토리 생성 ───────────────────────────────────
      - name: Create reports directory
        run: mkdir -p reports

      # ── 6. E2E 테스트 실행 ────────────────────────────────────────
      - name: Run E2E tests
        run: |
          FILTER="${{ github.event.inputs.test_filter }}"
          if [ -n "$FILTER" ]; then
            pytest tests/e2e/ -v \
              --html=reports/e2e-report.html \
              --self-contained-html \
              -k "$FILTER" \
              --tb=short \
              2>&1 | tee reports/e2e-output.txt
          else
            pytest tests/e2e/ -v \
              --html=reports/e2e-report.html \
              --self-contained-html \
              --tb=short \
              2>&1 | tee reports/e2e-output.txt
          fi
        continue-on-error: true

      # ── 7. 결과 요약 출력 ─────────────────────────────────────────
      - name: Print test summary
        if: always()
        run: |
          echo "====== E2E TEST SUMMARY ======"
          tail -30 reports/e2e-output.txt || true

      # ── 8. HTML 리포트 아티팩트 업로드 ───────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_number }}
          path: reports/
          retention-days: 14

      # ── 9. 실패 시 Job 결과 반영 ─────────────────────────────────
      - name: Check test result
        run: |
          grep -E "^(FAILED|ERROR)" reports/e2e-output.txt && exit 1 || exit 0
